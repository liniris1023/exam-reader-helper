<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評量報讀小幫手｜學生端</title>
<!-- 學生端入口：自動轉到學生端（只能掃老師的考卷 QR Code 或拍照報讀），並保留網址後面的考卷參數 -->
<script>
(function(){
  var q = location.search ? location.search.slice(1) : '';
  if(!/(^|&)student=1(&|$)/.test(q)) q = (q ? q + '&' : '') + 'student=1';
  location.replace('./index.html?' + q + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./index.html?student=1"></noscript>
<style>
  :root{--bg:#e6ecef;--ink:#1c2a33}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181d;--ink:#e5edf1}}
  :root[data-theme="dark"]{--bg:#11181d;--ink:#e5edf1}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:1.2rem;padding:16px}
  a{color:#0f7b6c}
</style>
</head>
<body>
<p>正在打開學生端…　若沒有自動打開，請<a href="./index.html?student=1">點這裡</a>。</p>
</body>
</html>
